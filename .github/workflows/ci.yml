name: Minimal PR CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ci-general]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13
      - name: Install pinned Gitleaks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-8.30.1"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$archive" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          "$install_dir/gitleaks" version
      - name: Scan PR commit range with Gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks-8.30.1/gitleaks
        run: |
          set -euo pipefail
          nice -n 10 "$GITLEAKS_BIN" git \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact=100 \
            --no-banner \
            .
      - name: Parse tracked Markdown and YAML syntax
        run: |
          nice -n 10 python3 - <<'PY'
          import os
          import subprocess
          import sys

          entries = subprocess.run(
              ["git", "ls-files", "-z"], check=True, stdout=subprocess.PIPE
          ).stdout.split(b"\0")
          paths = [os.fsdecode(item) for item in entries if item]
          markdown = [p for p in paths if p.lower().endswith((".md", ".markdown"))]
          yaml_files = [p for p in paths if p.lower().endswith((".yml", ".yaml"))]

          def parse(parser, files):
              if not files:
                  print(f"No tracked {parser} files; skipping.")
                  return
              command = [
                  "npx", "--yes", "--package=prettier@3.10.1", "prettier",
                  "--no-config", "--parser", parser, *files,
              ]
              subprocess.run(command, check=True, stdout=subprocess.DEVNULL)
              print(f"Parsed {len(files)} tracked {parser} file(s).")

          parse("markdown", markdown)
          parse("yaml", yaml_files)
          PY
